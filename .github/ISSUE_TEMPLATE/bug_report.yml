name: Bug report
description: Something in the engine behaves differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: several behaviors that look like bugs are documented decisions.
        Worth a glance at [docs/ARCHITECTURE.md](../blob/main/docs/ARCHITECTURE.md) —
        especially degradation to Mock when no API key is configured, and the fact that
        a running world owns its `world.db` exclusively.

        ⚠️ **Never attach `world.db.key`.** It decrypts the API key stored in the
        database. See [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        The smallest thing that shows it — a few CLI commands, or a short script using
        `World.open`. If it needs a world file, say how to build one from scratch rather
        than attaching yours.
      render: shell
    validations:
      required: true

  - type: input
    id: engine-version
    attributes:
      label: Engine version
      description: 'Output of: python -c "import anima_world; print(anima_world.__version__)"'
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version and OS
      placeholder: "3.13.1, Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: anima-world doctor --skip-probe
      description: >
        If the world exists, paste the health check. It reports the db format version,
        whether the keyfile is present, and how fast the clock runs — which is usually
        enough to rule out half the possibilities. Secrets are masked in this output.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: llm
    attributes:
      label: LLM state
      options:
        - label: An API key is configured and `doctor` confirms it answers
        - label: No key configured — the world is running on Mock
