name: Release

# Push a tag, get a release. No API token anywhere — PyPI trusts this workflow
# through OIDC (trusted publishing), so there is no secret to leak or rotate.
#
#   git tag -a v1.0.1 -m "..." && git push origin v1.0.1
#
# The pipeline is staged: everything goes to TestPyPI first, gets installed back
# out of that index and actually run, and only then reaches PyPI. PyPI refuses to
# ever re-upload a version, so the first attempt is the only attempt — a staging
# index that permits mistakes is the only place left to find them.
#
#   verify → build → testpypi → smoke (install FROM the index) → pypi
#
# Requires a one-time setup on PyPI: project page → Manage → Publishing →
# add a GitHub publisher with owner `aubrey-anima`, repo `core`,
# workflow `release.yml`, environment `pypi`.
#
# TestPyPI needs its OWN publisher, registered separately at test.pypi.org — it
# is a different service with different accounts, and a PyPI publisher grants
# nothing there. Without it the run fails at the TestPyPI step with
# `invalid-publisher` even though every field is correct, which reads like a
# broken release pipeline and is not one. Register it as a *pending* publisher
# if the project does not exist on TestPyPI yet.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "How far to go"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: The tag must match the version the package reports
        # Version is contract here: one release freezes engine code, storage shape
        # (Redis key prefix / MySQL tables — world.db retired in 2.0) and package
        # format together, and `__init__.py` is the single source. A tag that
        # disagrees with it would publish a version nobody can reproduce from the
        # repository. `__init__.py` imports nothing, so this needs no install.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import anima_world; print(anima_world.__version__)")
          echo "tag=$tag  __version__=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match __version__ $pkg — bump one of them"
            exit 1
          fi

      - run: pip install -e ".[dev]"

      - run: python -m pytest -q

  build:
    # Built exactly once, and every later job consumes this artifact. Building
    # separately per publish target would mean TestPyPI validated one set of
    # bytes while PyPI received another — the staging run would prove nothing
    # about what users actually download.
    needs: verify
    runs-on: ubuntu-latest
    services:
      # 2.0: the world lives on Redis. A real server, not fakeredis, on purpose —
      # this step exercises the artifact the way a host does, and a host brings a
      # real Redis. It also proves the wheel's redis-py pin actually satisfies the
      # client the engine uses, and that the CLI (which can only be handed a URL,
      # never an injected client) reaches a world at all.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install build twine

      - run: python -m build

      - run: python -m twine check dist/*

      - id: version
        run: |
          v=$(python -c "import anima_world; print(anima_world.__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building $v"

      - name: Install the built wheel clean and use it
        # Cheap local gate before anything leaves the runner. The suite in
        # `verify` ran against the working tree; a wheel can still differ from
        # it — a missing package-data entry is invisible until something
        # installs the artifact and finds the file gone.
        #
        # This is deliberately the same shape as ci.yml's `package` job, which is
        # green on every push to main. It was NOT, for a long time: it still called
        # the 1.x `World.open('rel.db', force_mock_llm=True)`, so the v3.0.0 release
        # died right here with `World.open() missing 1 required keyword-only
        # argument: 'redis'` — and 2.x/3.x therefore never reached PyPI at all
        # while the README kept flying a PyPI badge. Keep the two jobs in step:
        # a release gate that lags the engine is worse than no gate, because it
        # fails on itself instead of on the package.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python -c "
          import redis
          from anima_world.api import World
          # decode_responses=True is part of the contract: a raw-bytes client
          # turns quantity names into b'树高' and rules mis-key in silence.
          def conn():
              return redis.Redis.from_url('redis://127.0.0.1:6379/0', decode_responses=True)
          with World.open('rel', redis=conn(), force_mock_llm=True) as w:
              before = w.tick(50)
              assert len(w.state()['agents']) == 3
          with World.open('rel', redis=conn(), force_mock_llm=True) as w:
              assert w.state()['world_time']['tick'] == before, 'clock must survive a restart'
          print('wheel works, clock persists')
          "
          /tmp/clean/bin/anima-world --help > /dev/null
          /tmp/clean/bin/anima-world simulate --redis redis://127.0.0.1:6379/0 \
              --world-id rel2 --ticks 20 --llm mock

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rehearsal is worth repeating. Note the consequence: re-running the
          # SAME version leaves the earlier upload in place, so the smoke job
          # below then exercises those older files rather than this build. For a
          # real release the version is always new, so this only affects reruns.
          skip-existing: true

  smoke:
    # The point of the whole exercise: install from an index, the way a user
    # will, and run a world out of what came back. Everything up to here tested
    # files sitting on the runner's disk.
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    services:
      # Same reasoning as `build`, one step further out: what a user installs is
      # a package with `redis` as a hard dependency and no server of its own, so
      # the only honest rehearsal is a real Redis. fakeredis would be cheaper and
      # is what the suite runs on — but it is a *dev* extra, absent from what came
      # back off the index, and it cannot be handed to the CLI at all (the CLI
      # takes a URL). Reaching for it here would quietly shrink this job to an
      # import check, which is exactly the thing it exists to be more than.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install from TestPyPI and run a world
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # --extra-index-url is not optional: the three runtime dependencies
          # (redis, openai, httpx) do not exist on TestPyPI, so a bare
          # --index-url cannot resolve them.
          # --no-cache-dir keeps a previously cached wheel from standing in for
          # the one that was just uploaded.
          #
          # TestPyPI's index takes a moment to reflect a fresh upload, so retry
          # rather than fail on a race that says nothing about the package.
          for attempt in 1 2 3 4 5 6; do
            if pip install --no-cache-dir \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "anima-world==${VERSION}"; then
              installed=yes && break
            fi
            echo "not visible on the index yet (attempt $attempt) — waiting"
            sleep 20
          done
          [ "${installed:-no}" = yes ] || { echo "::error::anima-world==${VERSION} never became installable from TestPyPI"; exit 1; }

          cd /tmp
          python -c "
          import anima_world
          import redis
          from anima_world.api import World
          assert anima_world.__version__ == '${VERSION}', anima_world.__version__

          # decode_responses=True is part of the contract, not a nicety: a
          # raw-bytes client turns quantity names into b'树高' and world rules
          # mis-key against them in silence.
          def conn():
              return redis.Redis.from_url('redis://127.0.0.1:6379/0', decode_responses=True)

          # demo.cyberworld is the package's only package-data file, and the
          # failure mode it guards against is silent: without it a world still
          # boots, just with hardcoded defaults instead of the authored roster.
          with World.open('smoke', redis=conn(), force_mock_llm=True) as w:
              agents = w.state()['agents']
              assert len(agents) == 3, agents
              tick = w.tick(100)
              assert w.memories(next(iter(agents))), 'memory subsystem produced nothing'
          # A restart against the same key prefix. Under world.db this proved the
          # file was written; under Redis it proves something the engine cares
          # about more — that reopening a live world fills gaps instead of
          # replaying genesis over the top of it.
          with World.open('smoke', redis=conn(), force_mock_llm=True) as w:
              assert w.state()['world_time']['tick'] == tick, 'clock did not survive a restart'
          print('installed from TestPyPI and ran a world:', anima_world.__version__)
          "
          anima-world --help > /dev/null
          # The CLI half, and the only path that goes through argument parsing:
          # the 2.0 renames (--db-path → --redis + --world-id) broke every
          # consumer, and a wheel whose CLI cannot reach a world is not a release.
          anima-world simulate --redis redis://127.0.0.1:6379/0 \
              --world-id smoke2 --ticks 20 --llm mock
          anima-world contract --json > /dev/null

      - name: Report what a user would see
        run: |
          pip show anima-world | grep -E "^(Name|Version|License|Requires)"

  pypi:
    # Only after a build of these exact bytes has been installed out of an index
    # and run. Skipped for a rehearsal.
    needs: [build, testpypi, smoke]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
