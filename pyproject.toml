[build-system]
# >=77: the SPDX-string `license` + `license-files` keys below are PEP 639,
# which older setuptools rejects at build time.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-world"
dynamic = ["version"]
description = "A world-simulation engine for LLM-driven agents: event-sourced core, behavior-tree scheduling, memory and relationships, packaged as portable .cyberworld files"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ANIMA", email = "aubrey@animametaverse.com" }]
keywords = ["simulation", "agents", "llm", "event-sourcing", "behavior-tree", "worldbuilding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The engine is a pure library — no HTTP server, no web framework. Anything
# that uses a world imports this package (anima_world.api.World). Keep this
# list minimal — every dependency lands inside every host that embeds a world.
dependencies = [
    "openai>=1.30",        # LLM client: chat / narrative / planning / relationship judge
    "httpx>=0.27",         # injected transport for the OpenAI-compatible client
    # world.db 退役后世界住在 Redis 里 —— 客户端库因此是必需的(服务端仍是
    # 用户自己的;测试与试玩可用 fakeredis)。cryptography 随 keyfile 一起退役:
    # 世界里没有 secret,钥匙住机器配置(0600 明文,见 machine_config)。
    "redis>=5.0",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]   # mysql= 的世界:无限增长的四样(传工厂,别传裸连接)
dev = ["pytest>=8.0", "build>=1.2", "twine>=5.0", "fakeredis[lua]>=2.20", "pymysql>=1.1"]

[project.urls]
Homepage = "https://animametaverse.com"
Source = "https://github.com/aubrey-anima/core"
Issues = "https://github.com/aubrey-anima/core/issues"
Changelog = "https://github.com/aubrey-anima/core/blob/main/CHANGELOG.md"

[project.scripts]
anima-world = "anima_world.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "anima_world.__version__" }

[tool.setuptools.packages.find]
include = ["anima_world*"]

[tool.setuptools.package-data]
anima_world = ["demo.cyberworld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A ROS install on PYTHONPATH makes its pytest plugins visible to entry-point
# autoload, and they explode at import time (launch_testing → launch → lark),
# before any test runs. Blocking a plugin name that isn't installed is a no-op,
# so this costs nothing on a clean machine and removes the `PYTHONPATH= pytest`
# dance on one that has ROS sourced.
addopts = "-p no:launch_testing -p no:launch_ros"
